<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' data: https://cdnjs.cloudflare.com;">
    <title>MD Book</title>
    <style>
        /* Reset margins and set up the page box model */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            gap: 1rem;
            width: 100vw;
            height: 100vh;
            max-width: unset;
            padding: 2rem 1.25rem;
        }

        nav {
            position: fixed;
            padding-top: 5rem;
        }

        nav ul {
            list-style: none;
            display: flex;
            flex-direction: column;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        main #content {
            width: 100%;
            max-width: 80ch;
        }
    </style>
</head>

<body>
    <nav>
        <div id="toc"></div>
        <div>
            <h4>Tema</h4>
            <select id="themeSelector"></select>
        </div>
    </nav>
    <main>
        <div id="content" class="latex"></div>
    </main>

    <script type="module">
        import { marked } from 'https://cdn.jsdelivr.net/npm/marked/+esm';
        import mathMarked from 'https://cdn.jsdelivr.net/npm/@webc.site/math-marked/+esm';

        marked.use({ gfm: true });
        marked.use(mathMarked());

        function getPagePath(url) {
            return new URL(url).hash.slice(1)
        }

        async function loadToc() {
            const response = await fetch(`./toc.md`);
            const md = await response.text();
            document.getElementById('toc').innerHTML = marked.parse(md);
        }

        async function loadPage(mdPage) {
            const response = await fetch(`./${mdPage}`);
            const md = await response.text();
            document.getElementById('content').innerHTML = marked.parse(md);
        }

        loadToc();

        navigation.addEventListener('navigate', (event) => {
            loadPage(getPagePath(event.destination.url));
        });

        loadPage(getPagePath(navigation.currentEntry.url) || 'main.md');

        const themes = {
            latex: { label: 'LaTeX', url: 'https://cdn.jsdelivr.net/npm/latex.css@1.13.0/style.min.css' },
            tufle: { label: 'Tufle', url: 'https://cdnjs.cloudflare.com/ajax/libs/tufte-css/1.8.0/tufte.min.css' },
        };

        let themeSelected = 'latex';
        let removeLastLink = () => { }
        function loadTheme() {
            const link = document.createElement("link");
            link.rel = "stylesheet";
            link.href = themes[themeSelected].url;
            removeLastLink();
            document.head.prepend(link);
            removeLastLink = () => {
                link.remove();
            };
        }

        const themeSelector = document.getElementById('themeSelector');
        Object.entries(themes).forEach(([value, { label }]) => {
            const option = document.createElement('option');
            option.value = value;
            option.text = label;
            option.selected = themeSelected === value;
            themeSelector.append(option);
        })
        themeSelector.addEventListener('change', (event) => {
            themeSelected = event.target.value;
            loadTheme();
        })

        loadTheme();
    </script>
</body>

</html>

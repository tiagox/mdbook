<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD Book</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/latex.css@1.13.0/style.min.css">
    <!-- <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tufte-css/1.8.0/tufte.min.css"> -->
    <style>
        /* Reset margins and set up the page box model */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            gap: 1rem;
            width: 100%;
            max-width: unset;
            padding: 2rem 1.25rem;
        }

        nav {
            padding-top: 5rem;
        }

        nav ul {
            list-style: none;
            display: flex;
            flex-direction: column;
        }

        main {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        main #content {
            width: 100%;
            max-width: 80ch;
        }
    </style>
</head>

<body>
    <nav id="toc"></nav>
    <main>
        <div id="content"></div>
    </main>

    <script type="module">
        import { marked } from 'https://cdn.jsdelivr.net/npm/marked/+esm';
        import mathMarked from 'https://cdn.jsdelivr.net/npm/@webc.site/math-marked/+esm';

        marked.use({ gfm: true });
        marked.use(mathMarked());

        function getPagePath(url) {
            return new URL(url).hash.slice(1)
        }

        async function loadToc() {
            const response = await fetch(`./toc.md`);
            const md = await response.text();
            document.getElementById('toc').innerHTML = marked.parse(md);
        }

        async function loadPage(mdPage) {
            const response = await fetch(`./${mdPage}`);
            const md = await response.text();
            document.getElementById('content').innerHTML = marked.parse(md);
        }

        loadToc();

        navigation.addEventListener('navigate', (event) => {
            loadPage(getPagePath(event.destination.url));
        });

        loadPage(getPagePath(navigation.currentEntry.url) || 'main.md');
    </script>
</body>

</html>
